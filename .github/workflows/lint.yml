name: Code Quality

on:
  push:
    branches: [ claude/*, main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          flake8 src/ scanners/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ scanners/ --count --exit-zero --max-complexity=10 --max-line-length=120

      - name: Format check with black
        run: |
          black --check src/ scanners/

      - name: Type check with mypy
        run: |
          mypy src/ --ignore-missing-imports || true

      - name: Sort imports with isort
        run: |
          isort --check-only src/ scanners/
